services:
  postgres:
    image: postgres:15-alpine
    container_name: credit-risk-postgres
    restart: unless-stopped
    # Values come from the .env file alongside this compose file. See
    # .env.example for the expected keys. Defaults shown via `${VAR:-fallback}`
    # keep the dev-on-boot experience working even without a .env.
    environment:
      POSTGRES_DB:       ${DB_NAME:-credit_risk}
      POSTGRES_USER:     ${DB_USER:-credit_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env before docker compose up}
    ports:
      - "${DB_PORT:-5433}:5432"   # host 5433 -> container 5432 (5432 often occupied)
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
